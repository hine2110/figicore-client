name: Deployment

on:
  push:
    branches: [devops]
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: rice-warehouse-admin-env

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ secrets.GHCR_USERNAME }}
          password: ${{ secrets.GHCR_PASSWORD }}
      
      - name: Set up environment variables
        run: |
          cat <<EOF > .env
          VITE_API_BASE_URL=${{ vars.VITE_API_BASE_URL }}
          VITE_SEPAY_BANK_NAME=${{ vars.VITE_SEPAY_BANK_NAME }}
          VITE_SEPAY_ACCOUNT_NUMBER=${{ vars.VITE_SEPAY_ACCOUNT_NUMBER }}
          VITE_LIVEKIT_WS_URL=${{ vars.VITE_LIVEKIT_WS_URL }}
          EOF

      - name: Run build.sh
        run: |
          chmod +x build.sh
          sh ./build.sh

      - name: SSH Deploy to Server
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          password: ${{ secrets.SSH_PASSWORD }}
          script: |
            cd repo/figicore/figicore-client/
            sh restart.sh